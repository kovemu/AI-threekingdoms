[package]
name = "ai-threekingdoms"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "ai_threekingdoms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
sha2 = "0.10"
futures-util = "0.3"
sysinfo = "0.33"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ai-threekingdoms"
path = "src/main.rs"
required-features = ["desktop"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
